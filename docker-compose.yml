services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grc}
      POSTGRES_USER: ${POSTGRES_USER:-grc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grc-dev-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grc} -d ${POSTGRES_DB:-grc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  object-storage:
    # Development-only S3-compatible implementation. Keep application code provider-neutral.
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-grc-dev}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-grc-dev-secret}
    volumes:
      - object_storage_data:/data
    ports:
      - "9001:9001"

  object-storage-init:
    image: minio/mc:latest
    depends_on:
      - object-storage
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set dev http://object-storage:9000 ${S3_ACCESS_KEY:-grc-dev} ${S3_SECRET_KEY:-grc-dev-secret}; do sleep 2; done;
      /usr/bin/mc mb --ignore-existing dev/${S3_BUCKET:-grc-evidence};
      exit 0;"

  backend:
    build:
      context: ./backend
    env_file:
      - .env
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --timeout 60"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live', timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    command: celery -A config worker -l INFO
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    env_file:
      - .env
    command: celery -A config beat -l INFO
    volumes:
      - ./backend:/app
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes:
      - ollama_data:/root/.ollama
    # Models are intentionally not auto-downloaded. Air-gapped deployments import approved model artifacts separately.

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api/v1}
    depends_on:
      backend:
        condition: service_healthy

  gateway:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data:
  redis_data:
  object_storage_data:
  ollama_data:
