services:
  gateway:
    ports: !override
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/pilot-tls.conf:/etc/nginx/conf.d/default.conf:ro
      - ${TLS_CERT_PATH:-./runtime/tls/server.crt}:/etc/nginx/tls/server.crt:ro
      - ${TLS_KEY_PATH:-./runtime/tls/server.key}:/etc/nginx/tls/server.key:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/gateway-health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
