services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grc}
      POSTGRES_USER: ${POSTGRES_USER:-grc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres_pilot_data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grc} -d ${POSTGRES_DB:-grc}"]
      interval: 5s
      timeout: 5s
      retries: 15

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis_pilot_data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  objectstore:
    image: chrislusf/seaweedfs:4.47
    command: ["mini", "-dir=/data"]
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-grc-evidence}
    volumes: [objectstore_pilot_data:/data]
    restart: unless-stopped

  backend:
    image: grc-backend:${GRC_RELEASE_VERSION:-local}
    build: ./backend
    env_file:
      - "${PILOT_ENV_FILE:-.env}"
    environment:
      GRC_RELEASE_VERSION: ${GRC_RELEASE_VERSION:-local}
    command: sh -c "python manage.py migrate && python manage.py check --deploy && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --threads 4 --timeout 90"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      objectstore: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/api/v1/health/ready', headers={'X-Forwarded-Proto':'https'}); urllib.request.urlopen(r, timeout=2)\""]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  worker:
    image: grc-backend:${GRC_RELEASE_VERSION:-local}
    build: ./backend
    env_file:
      - "${PILOT_ENV_FILE:-.env}"
    environment:
      GRC_RELEASE_VERSION: ${GRC_RELEASE_VERSION:-local}
    command: celery -A config worker -l INFO
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  beat:
    image: grc-backend:${GRC_RELEASE_VERSION:-local}
    build: ./backend
    env_file:
      - "${PILOT_ENV_FILE:-.env}"
    environment:
      GRC_RELEASE_VERSION: ${GRC_RELEASE_VERSION:-local}
    command: celery -A config beat -l INFO
    depends_on:
      backend: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  frontend:
    image: grc-frontend:${GRC_RELEASE_VERSION:-local}
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api/v1
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  ollama:
    profiles: ["local-ai"]
    image: ollama/ollama:0.34.1
    command: ["serve"]
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
    volumes: [ollama_pilot_data:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  ops:
    profiles: ["ops"]
    image: grc-backend:${GRC_RELEASE_VERSION:-local}
    build: ./backend
    env_file:
      - "${PILOT_ENV_FILE:-.env}"
    environment:
      GRC_RELEASE_VERSION: ${GRC_RELEASE_VERSION:-local}
    volumes:
      - ./backups:/backups
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      objectstore: {condition: service_started}

  gateway:
    image: nginx:1.28.0-alpine
    ports: ["8080:80"]
    volumes: ["./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      frontend: {condition: service_healthy}
      backend: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

volumes:
  postgres_pilot_data:
  redis_pilot_data:
  objectstore_pilot_data:
  ollama_pilot_data:
