name: hydrate-public-candidate

on:
  push:
    branches:
      - main
    paths:
      - public-export/ready

permissions:
  contents: write

jobs:
  hydrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transfer payload
        uses: actions/checkout@v4

      - name: Verify and extract exact candidate
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="3443bea23764bcf0ebf12b43b075396565963ef0"
          test "$(cat public-export/candidate.sha)" = "$EXPECTED"
          test -n "$(find public-export -maxdepth 1 -type f -name 'chunk-*' -print -quit)"

          cat public-export/chunk-* | base64 -d > /tmp/grc-candidate.tar.gz
          ACTUAL="$(sha256sum /tmp/grc-candidate.tar.gz | awk '{print $1}')"
          EXPECTED_ARCHIVE="$(cat public-export/snapshot.sha256)"
          test "$ACTUAL" = "$EXPECTED_ARCHIVE"

          rm -rf /tmp/grc-candidate
          mkdir -p /tmp/grc-candidate
          python3 - <<'PY'
          import pathlib
          import tarfile

          archive = pathlib.Path("/tmp/grc-candidate.tar.gz")
          dest = pathlib.Path("/tmp/grc-candidate")
          with tarfile.open(archive, "r:gz") as tf:
              for member in tf.getmembers():
                  p = pathlib.PurePosixPath(member.name)
                  if p.is_absolute() or ".." in p.parts or member.issym() or member.islnk():
                      raise SystemExit(f"unsafe archive member: {member.name}")
              tf.extractall(dest, filter="data")
          PY

          cp .github/workflows/hydrate-public-candidate.yml /tmp/hydrate-public-candidate.yml

          shopt -s dotglob nullglob
          for item in * .*; do
            case "$item" in
              .|..|.git) continue ;;
            esac
            rm -rf -- "$item"
          done

          cp -a /tmp/grc-candidate/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/hydrate-public-candidate.yml .github/workflows/hydrate-public-candidate.yml
          printf '%s\n' "$EXPECTED" > PUBLIC_PILOT_SOURCE_SHA

      - name: Commit hydrated snapshot without workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hydrate public Pilot candidate content 3443bea23764bcf0ebf12b43b075396565963ef0"
          git push origin HEAD:main
